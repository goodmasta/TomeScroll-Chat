name: Build and Release

on:
  push:
    branches: [main]
    paths:
      - "TomeScrollChat/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install Dalamud (CI has no XIVLauncher install)
        shell: pwsh
        run: |
          $dalamudDir = "$env:RUNNER_TEMP\dalamud"
          New-Item -ItemType Directory -Force -Path $dalamudDir | Out-Null
          Invoke-WebRequest -Uri "https://goatcorp.github.io/dalamud-distrib/latest.zip" -OutFile "$env:RUNNER_TEMP\dalamud.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\dalamud.zip" -DestinationPath $dalamudDir -Force
          "DALAMUD_HOME=$dalamudDir" >> $env:GITHUB_ENV

      - name: Build (Release)
        run: dotnet build TomeScrollChat.sln -c Release

      - name: Read plugin version from csproj
        id: version
        shell: pwsh
        run: |
          [xml]$csproj = Get-Content TomeScrollChat/TomeScrollChat.csproj
          $version = $csproj.Project.PropertyGroup.Version | Select-Object -First 1
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Update pluginmaster.json
        shell: pwsh
        run: |
          $json = Get-Content pluginmaster.json -Raw | ConvertFrom-Json
          $json[0].AssemblyVersion = "${{ steps.version.outputs.version }}"
          $json[0].LastUpdate = [int][double]::Parse((Get-Date -UFormat %s))
          # -AsArray is required even for a single-entry array: piping a one-element
          # PowerShell array through ConvertTo-Json without it unwraps to a bare {...}
          # object instead of [{...}], which Dalamud's repo parser rejects.
          ($json | ConvertTo-Json -Depth 10 -AsArray) | Set-Content pluginmaster.json

      - name: Commit updated pluginmaster.json
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pluginmaster.json
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "pluginmaster.json unchanged, skipping commit."
          } else {
            git commit -m "Update pluginmaster.json for $($env:VERSION)"
            git push
          }
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - name: Move the rolling 'latest' tag
        run: |
          git tag -f latest
          git push -f origin latest

      - name: Publish GitHub release with the packaged plugin
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exists = gh release view latest 2>$null
          if (-not $exists) {
            gh release create latest --title "latest" --notes "Automated build - see pluginmaster.json for the version this corresponds to."
          }
          gh release upload latest "TomeScrollChat/bin/x64/Release/TomeScrollChat/latest.zip" --clobber

      - name: Tag and publish a permanent, version-numbered release
        # The 'latest' release/tag above is what the custom repository actually installs/updates from,
        # and is deliberately overwritten every push - it has no memory of past versions. This step is
        # what keeps past versions around as real, permanent, browsable releases (never overwritten,
        # each with its own notes) instead of only ever existing in git commit history. Skips entirely
        # if this exact version's tag already exists, so re-running the workflow (or pushing again
        # without bumping <Version>) doesn't fail trying to recreate it.
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $tag = "v$version"

          if (git tag -l $tag) {
            Write-Host "Tag $tag already exists - this version was already released, skipping."
            exit 0
          }

          # Pulls this version's own section out of CHANGELOG.md (from its "## [version]" heading up
          # to the next "## [" heading, or end of file) to use as the release notes - falls back to a
          # generic line if the changelog has no entry for this version yet, rather than failing.
          $notes = "See CHANGELOG.md for details."
          if (Test-Path CHANGELOG.md) {
            $lines = Get-Content CHANGELOG.md
            $startIdx = -1
            $endIdx = $lines.Count
            for ($i = 0; $i -lt $lines.Count; $i++) {
              if ($lines[$i] -match "^## \[$([regex]::Escape($version))\]") {
                $startIdx = $i + 1
                for ($j = $startIdx; $j -lt $lines.Count; $j++) {
                  if ($lines[$j] -match "^## \[") {
                    $endIdx = $j
                    break
                  }
                }
                break
              }
            }
            if ($startIdx -ge 0 -and $startIdx -lt $endIdx) {
              $notes = ($lines[$startIdx..($endIdx - 1)] -join "`n").Trim()
            }
          }

          $notesPath = "$env:RUNNER_TEMP\release-notes.md"
          Set-Content -Path $notesPath -Value $notes -NoNewline

          git tag $tag
          git push origin $tag

          gh release create $tag --title $tag --notes-file $notesPath
          gh release upload $tag "TomeScrollChat/bin/x64/Release/TomeScrollChat/latest.zip" --clobber
